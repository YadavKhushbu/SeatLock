name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN cannot create check runs, which the test reporter
# below needs. Granting the minimum rather than write-all: contents to read the
# repository, checks to publish the test report.
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # No service containers here on purpose. Testcontainers starts Postgres and
      # Redis itself, which keeps the CI definition and the local run identical:
      # anything that passes here passes on a laptop, with no separate setup.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

      - name: Build Docker image
        run: docker build -t seatlock:${{ github.sha }} .
